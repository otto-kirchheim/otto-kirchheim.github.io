# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        # @otto-kirchheim/nebengeld-shared ist eine public Git-Branch-Dependency -- kein Token noetig.
        # ASSET_* entschluesseln im Postinstall von @db-ux/db-theme die Markenassets (Schriften,
        # Icons). Fehlen die Repo-Secrets, laeuft der Build durch -- aber ohne DB-Schriften.
        run: bun install --frozen-lockfile
        env:
          ASSET_PASSWORD: ${{ secrets.ASSET_PASSWORD }}
          ASSET_INIT_VECTOR: ${{ secrets.ASSET_INIT_VECTOR }}
      - name: Typecheck
        run: bun run typecheck
      - name: Build
        run: bun run build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
